<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="心坷的涂鸦作品集，浏览作品缩略图并打开原图欣赏细节。">
  <title>涂鸦室 - 画廊</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/gallery.css">
  <script src="../../assets/js/gallery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../../index.html" class="site-logo">HeartRough</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="../../index.html">🏠 首页</a>
        <a href="../html-study/index.html">📝 HTML日志</a>
      </nav>
    </div>
  </header>
  <main class="site-main">
    <div class="page-header">
      <a href="../../index.html" class="back-link">← 返回首页</a>
      <h1>🎨 涂鸦室</h1>
    </div>
    <section class="content gallery-page" aria-labelledby="galleryHeading">
      <h2 id="galleryHeading">涂鸦作品</h2>
      <div class="gallery-grid">
        <figure class="gallery-item">
          <a href="../../assets/images/doodling/Money.jpg" aria-label="查看 Money 原图">
            <img src="../../assets/images/doodling/thumbnails/Money.webp" alt="涂鸦作品：Money" width="350" height="244" decoding="async">
          </a>
          <figcaption class="img-name">Money</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../../assets/images/doodling/QiLaiHuTao.jpg" aria-label="查看 QiLaiHuTao 原图">
            <img src="../../assets/images/doodling/thumbnails/QiLaiHuTao.webp" alt="涂鸦作品：QiLaiHuTao" width="350" height="430" decoding="async" loading="lazy">
          </a>
          <figcaption class="img-name">QiLaiHuTao</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../../assets/images/doodling/test.jpg" aria-label="查看练习涂鸦原图">
            <img src="../../assets/images/doodling/thumbnails/test.webp" alt="练习涂鸦" width="270" height="800" decoding="async" loading="lazy">
          </a>
          <figcaption class="img-name">练习涂鸦</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../../assets/images/doodling/XiaoMai.jpg" aria-label="查看 XiaoMai 原图">
            <img src="../../assets/images/doodling/thumbnails/XiaoMai.webp" alt="涂鸦作品：XiaoMai" width="350" height="404" decoding="async" loading="lazy">
          </a>
          <figcaption class="img-name">XiaoMai</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../../assets/images/doodling/MengWang.png" aria-label="查看 MengWang 原图">
            <img src="../../assets/images/doodling/thumbnails/MengWang.webp" alt="涂鸦作品：MengWang" width="800" height="485" decoding="async" loading="lazy">
          </a>
          <figcaption class="img-name">MengWang</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../../assets/images/doodling/DuBin.png" aria-label="查看 DuBin 原图">
            <img src="../../assets/images/doodling/thumbnails/DuBin.webp" alt="涂鸦作品：DuBin" width="800" height="588" decoding="async" loading="lazy">
          </a>
          <figcaption class="img-name">DuBin</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="../../assets/images/doodling/WenDi.png" aria-label="查看 WenDi 原图">
            <img src="../../assets/images/doodling/thumbnails/WenDi.webp" alt="涂鸦作品：WenDi" width="556" height="800" decoding="async" loading="lazy">
          </a>
          <figcaption class="img-name">WenDi</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <dialog class="lightbox" id="lightbox" aria-label="作品原图预览">
    <button class="close-btn" id="lightboxClose" type="button" aria-label="关闭预览" autofocus>×</button>
    <img id="lightboxImg" alt="" hidden>
    <p id="lightboxStatus" class="lightbox-status" role="status"></p>
  </dialog>
</body>
</html>
